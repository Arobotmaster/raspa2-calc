[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raspa2-calc"
version = "2.5.0"
description = "RASPA2/RASPA3 high-throughput calculation tools"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.21.0",
  "pandas>=1.3.0",
  "gemmi>=0.5.0",
  "PyYAML>=6.0",
  "openpyxl>=3.0.0",
  "tqdm>=4.60.0",
  "matplotlib>=3.5.0",
  "scipy>=1.7.0",
]

[project.scripts]
raspa-calc = "raspa_calc.entrypoints.interactive:main"
raspa-task-runner = "raspa_calc.entrypoints.task_runner:main"
raspa-plot-isotherm = "raspa_calc.entrypoints.isotherm_plotter:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
